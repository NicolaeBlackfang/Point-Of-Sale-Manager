# OpenPOS — security response headers
#
# Include this file in every `location` block that sets its own `add_header`
# directives: nginx drops the inherited headers of the parent block as soon as
# a child block declares an `add_header` of its own.
#
#   include /etc/nginx/snippets/openpos-security-headers.conf;
#
# IMPORTANT: replace https://api.example.com with the real API origin. The
# browser blocks every request to the backend when it is not listed in
# connect-src (and product photos are blocked in img-src).

add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https://api.example.com; connect-src 'self' https://api.example.com; font-src 'self' data:; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'; frame-src 'none'" always;
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "DENY" always;
add_header Referrer-Policy "no-referrer" always;
add_header Permissions-Policy "geolocation=(), camera=(), microphone=(), payment=()" always;
add_header Cross-Origin-Opener-Policy "same-origin" always;
add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
