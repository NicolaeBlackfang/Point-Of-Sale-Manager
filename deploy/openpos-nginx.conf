# OpenPOS — Nginx site configuration
#
# Copy to /etc/nginx/sites-available/openpos, replace the domain names, then:
#   sudo mkdir -p /etc/nginx/snippets
#   sudo cp openpos-security-headers.conf /etc/nginx/snippets/
#   sudo ln -s /etc/nginx/sites-available/openpos /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#   sudo certbot --nginx -d pos.example.com -d api.example.com
#
# The API listens on 127.0.0.1:5000 and is never exposed directly.

# ====================================================================
# The website (React SPA)
# ====================================================================
server {
    listen 80;
    listen [::]:80;
    server_name pos.example.com;

    root /opt/openpos/apps/web/dist;
    index index.html;

    # Security headers (CSP, HSTS, clickjacking protection, ...).
    # The API origin inside the CSP snippet must match api.example.com.
    include /etc/nginx/snippets/openpos-security-headers.conf;

    # SPA fallback — without this, refreshing a sub-route returns 404.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Hashed assets can be cached forever.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        # A location block with its own add_header loses the inherited
        # headers, so they are included again here.
        include /etc/nginx/snippets/openpos-security-headers.conf;
    }

    location = /index.html {
        add_header Cache-Control "no-cache";
        include /etc/nginx/snippets/openpos-security-headers.conf;
    }
}

# ====================================================================
# The API
# ====================================================================
server {
    listen 80;
    listen [::]:80;
    server_name api.example.com;

    # Base64 product photos are posted in the JSON body.
    client_max_body_size 6m;

    location /api/ {
        proxy_pass http://127.0.0.1:5000;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        "upgrade";
        proxy_read_timeout 60s;
    }

    # Uploaded product images.
    location /uploads/ {
        proxy_pass http://127.0.0.1:5000;
        proxy_set_header Host $host;
    }

    location / {
        # The API's own responses already carry the Helmet security headers;
        # only this nginx-generated 404 needs them added here.
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header X-Content-Type-Options "nosniff" always;
        return 404;
    }
}
